name: k8s-model-service

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "k8s-model-service/**"
      - ".github/workflows/k8s-model-service.yml"

permissions:
  contents: read

concurrency:
  group: k8s-model-service-${{ github.ref }}
  cancel-in-progress: true

env:
  KIND_VERSION: v0.33.0
  KIND_NODE: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
  KUBECTL_VERSION: v1.37.0
  ISTIO_VERSION: 1.32.0
  METRICS_SERVER_VERSION: v0.9.1

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install kind, kubectl and istioctl (pinned, checksum verified)
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"; cd "$RUNNER_TEMP"
          curl -fsSLo "$bin/kind" "https://github.com/kubernetes-sigs/kind/releases/download/$KIND_VERSION/kind-linux-amd64"
          sum=$(curl -fsSL "https://github.com/kubernetes-sigs/kind/releases/download/$KIND_VERSION/kind-linux-amd64.sha256sum" | awk '{print $1}')
          echo "$sum  $bin/kind" | sha256sum -c -
          curl -fsSLo "$bin/kubectl" "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl"
          echo "$(curl -fsSL "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl.sha256")  $bin/kubectl" | sha256sum -c -
          tgz="istio-$ISTIO_VERSION-linux-amd64.tar.gz"
          curl -fsSLO "https://github.com/istio/istio/releases/download/$ISTIO_VERSION/$tgz"
          sum=$(curl -fsSL "https://github.com/istio/istio/releases/download/$ISTIO_VERSION/$tgz.sha256" | awk '{print $1}')
          echo "$sum  $tgz" | sha256sum -c -
          tar -xzf "$tgz" --strip-components=2 -C "$bin" "istio-$ISTIO_VERSION/bin/istioctl"
          chmod +x "$bin"/*
          echo "$bin" >> "$GITHUB_PATH"

      - name: Create kind cluster (1 control plane, 2 workers)
        run: kind create cluster --config k8s-model-service/kind.yaml --image "$KIND_NODE" --wait 120s

      - name: Install metrics-server (needed by the HPA)
        run: |
          kubectl apply -f "https://github.com/kubernetes-sigs/metrics-server/releases/download/$METRICS_SERVER_VERSION/components.yaml"
          kubectl -n kube-system patch deployment metrics-server --type=json \
            -p '[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
          kubectl -n kube-system rollout status deployment/metrics-server --timeout=180s

      - name: Install Istio (minimal profile, istiod only, small requests)
        run: |
          istioctl install -y --set profile=minimal \
            --set values.pilot.resources.requests.cpu=100m --set values.pilot.resources.requests.memory=256Mi
          kubectl -n istio-system rollout status deployment/istiod --timeout=180s

      - name: Run the six tests
        run: bash k8s-model-service/tests.sh

      - name: Dump cluster state on failure
        if: failure()
        run: |
          mkdir -p k8s-model-service/out; cd k8s-model-service/out
          kubectl get events -A --sort-by=.lastTimestamp > events.txt 2>&1 || true
          kubectl get pods -A -o wide > pods.txt 2>&1 || true
          kubectl describe pods -A > pod-descriptions.txt 2>&1 || true
          for ns in plain mesh outside istio-system kube-system; do
            for p in $(kubectl -n "$ns" get pods -o name 2>/dev/null); do
              echo "=== $ns/$p"; kubectl -n "$ns" logs "$p" --all-containers --tail=300 2>&1
            done
          done > pod-logs.txt || true
          tail -n 80 events.txt; cat pods.txt; tail -n 150 pod-logs.txt

      - name: Upload results.json and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: k8s-model-service-results
          path: k8s-model-service/out/
          if-no-files-found: warn
          retention-days: 14
